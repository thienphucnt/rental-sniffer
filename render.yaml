services:
  - type: web
    name: rental-sniffer-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: MAX_LISTING_AGE_HOURS
        value: "48"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
